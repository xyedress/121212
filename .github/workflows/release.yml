name: Windows Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studyflow-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Build and verify Windows executables
        shell: pwsh
        run: ./build.ps1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-Windows-x64
          path: |
            release/StudyFlow-Windows-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0-practice17'
          $assets = @('release/StudyFlow-Windows-x64.zip', 'release/SHA256SUMS.txt')
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
              $tagSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha'
              if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:GITHUB_SHA) {
                  throw 'Existing release tag points to a different commit; create a new version.'
              }
              gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
              gh release create $tag @assets --target $env:GITHUB_SHA --title 'StudyFlow 1.0.0 - Windows x64' --notes 'Portable GUI and CLI package. Extract the ZIP and launch StudyFlow.exe. No separate Python installation required. Unsigned executables.' --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
